<body>
    <!-- Hero / main heading for contact page on mobile -->
    <section class="contact-main">
        <h1>
            CONTACT
        </h1>
    </section>

    <!-- Main contact content: intro text and future contact details -->
    <section class="contact-content">
        <div class="contact-txt">
            <!-- Introductory text for contact page -->
            <p>
                For further inquiries, please contact me using the details below. We look forward to hosting you soon!
            </p>
        </div>

        <div class="contact-img">
            <!-- Decorative / location image -->
            <img src="assets/images/WhatsApp Image 2025-08-07 at 8.26.27 PM.jpeg" alt="Sunset" width="45%">
        </div>

        <!-- Phone contact block: icon + number -->
        <div class="contact-img-phone">
            <!-- Phone icon (consider adding alt text for accessibility) -->
            <img src="assets/icons/phone.svg" alt="Phone icon">
        </div>
        <div class="contact-txt-phone">
            <p>
                +64 012 345 6789
            </p>
        </div>

        <!-- Email contact block: icon + address -->
        <div class="contact-img-mail">
            <!-- Mail icon (add alt text if needed) -->
            <img src="assets/icons/mail.svg" alt="Mail icon">
        </div>
        <div class="contact-txt-mail">
            <p>
                spamfilter@mozmail.com
            </p>
        </div>
