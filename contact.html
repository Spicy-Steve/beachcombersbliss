<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Page metadata: character encoding and responsive viewport -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beachcombers Bliss</title>

  <!-- Desktop stylesheet -->
  <link rel="stylesheet" href=css/desktop.css>
  <!-- Favicon shown in browser tab -->
  <link rel="icon" href="assets/icons/favicon.ico">

  <!-- Navigation bar (logo + page links + mobile site link) -->
  <div class="navbar">
    <nav>
      <!-- Site logo -->
      <a href="index.html"><img src="assets/icons/logo.png" alt="Logo" width="2%"></a>
      <!-- Primary navigation buttons -->
      <button onclick="window.location.href='index.html'">HOME</button>
      <button onclick="window.location.href='gallery.html'">GALLERY</button>
      <button onclick="window.location.href='bookings.html'">BOOKINGS</button>
      <button onclick="window.location.href='contact.html'">CONTACT</button>

      <!-- Link to mobile-optimized contact page -->
      <a href="contact-mobile.html"><img src="assets/icons/mobile.svg" alt="Mobile site" width="2%"></a>
    </nav>
  </div>
</head>

<body>
  <!-- Page header / hero for contact page -->
  <section class="contanct-main">
    <h1>
      CONTACT
    </h1>
  </section>

  <!-- Main contact content: text, image, and contact methods -->
  <section class="contanct-content">
    <div class="contanct-txt">
      <!-- Introductory text for contact page -->
      <p>
        For further inquiries, please contact me using the details below. We look forward to hosting you soon!
      </p>
    </div>

    <div class="contact-img">
      <!-- Decorative / location image -->
      <img src="assets/images/img7.jpeg" alt="Sunset" width="450">
    </div>

    <!-- Phone contact block: icon + number -->
    <div class="contact-img-phone">
      <!-- Phone icon (consider adding alt text for accessibility) -->
      <img src="assets/icons/phone.svg" alt="Phone icon">
    </div>
    <div class="contact-txt-phone">
      <p>
        +64 012 345 6789
      </p>
    </div>

    <!-- Email contact block: icon + address -->
    <div class="contact-img-mail">
      <!-- Mail icon (add alt text if needed) -->
      <img src="assets/icons/mail.svg" alt="Mail icon">
    </div>
    <div class="contact-txt-mail">
      <p>
        youremail@provider.com
      </p>
    </div>
  </section>
</body>
</html>
